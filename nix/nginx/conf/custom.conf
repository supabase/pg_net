location / {
  echo 'Hello world';
}

location /delay {
  echo_sleep $arg_s;
  echo 'ok';
}

location /echo-method {
  echo $request_method;
}

location /anything {
  echo $is_args$query_string;
}

location /headers {
  echo_duplicate 1 $echo_client_request_headers;
}

location /post {
  if ($request_method != 'POST'){
      return 405;
  }
  if ($http_content_type  != "application/json") {
      return 406;
  }
  default_type application/json;
  echo_read_request_body;
  echo $request_body;
}

location /delete {
  if ($request_method != 'DELETE'){
      return 405;
  }

  # Reject any request body, assumes they get sent with a content-type header (sufficient for our use cases)
  if ($http_content_type != "") {
      return 400;
  }

  echo_duplicate 1 $echo_client_request_headers$is_args$query_string;
}

location /delete_w_body {
  if ($request_method != 'DELETE'){
      return 405;
  }

  echo_read_request_body;
  echo $request_body;
}

location /redirect_me {
  add_header X-Redirect-Hop first;
  return 301 /to_here;
}

location /to_here {
  add_header X-Final-Hop last;
  echo 'I got redirected';
}

location /pathological {
  pathological;
}
